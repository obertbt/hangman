<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ログイン - hearth-life</title>
<style>
  :root { --bg: #fbfaf7; --fg: #23201c; --card: #fff; --line: #e5e0d8; --accent: #a2543a; --err: #b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #191715; --fg: #eae6df; --card: #221f1c; --line: #34302b; --accent: #d98e6a; --err: #f2b8b5; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--fg); padding: 1rem;
    font-family: system-ui, "Hiragino Sans", "Yu Gothic UI", sans-serif;
  }
  form {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 1.75rem; width: min(22rem, 100%);
  }
  h1 { font-size: 1.2rem; margin: 0 0 1.25rem; }
  label { display: block; font-size: .9rem; margin-bottom: .4rem; }
  input {
    font: inherit; width: 100%; padding: .6rem .7rem; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg);
  }
  button {
    font: inherit; width: 100%; margin-top: 1rem; padding: .6rem;
    border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer;
  }
  .error { color: var(--err); font-size: .9rem; margin: 0 0 1rem; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>hearth-life</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <label for="password">パスワード</label>
  <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
  <button type="submit">ログイン</button>
</form>
</body>
</html>
